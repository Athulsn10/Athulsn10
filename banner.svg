<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1033"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7F3ACE"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      .name { font: 700 46px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
      .role { font: 500 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #c9d1d9; }
      .code { font: 500 14px 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #8b949e; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .orb { animation: float 6s ease-in-out infinite; }
      .orb2 { animation: float 8s ease-in-out infinite reverse; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
  </defs>

  <rect width="900" height="200" rx="16" fill="url(#bg)"/>
  <rect width="900" height="200" rx="16" fill="url(#grid)"/>

  <circle class="orb" cx="780" cy="70" r="70" fill="#7F3ACE" fill-opacity="0.25"/>
  <circle class="orb2" cx="840" cy="150" r="40" fill="#C084FC" fill-opacity="0.18"/>

  <text x="56" y="62" class="code">&lt;hello world /&gt;</text>
  <text x="56" y="118" class="name">Athul S Nair</text>
  <rect x="58" y="134" width="64" height="4" rx="2" fill="url(#accent)"/>
  <text x="56" y="168" class="role">Software Engineer · Full Stack &amp; CMS · Kerala, India</text>
</svg>
