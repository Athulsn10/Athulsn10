<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f1240"/><stop offset="60%" stop-color="#120d24"/><stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7F3ACE"/><stop offset="50%" stop-color="#C084FC"/><stop offset="100%" stop-color="#7F3ACE"/>
      <animate attributeName="x1" values="-1;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity="0.045"/>
    </pattern>
    <radialGradient id="glow"><stop offset="0%" stop-color="#7F3ACE" stop-opacity="0.55"/><stop offset="100%" stop-color="#7F3ACE" stop-opacity="0"/></radialGradient>
    <clipPath id="type"><rect x="60" y="150" width="560" height="40">
      <animate attributeName="width" values="0;560" dur="2.2s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </rect></clipPath>
    <clipPath id="card"><rect width="1000" height="240" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1000" height="240" fill="url(#bg)"/>
    <rect width="1000" height="240" fill="url(#grid)"/>
    <circle cx="820" cy="80" r="190" fill="url(#glow)">
      <animate attributeName="r" values="170;205;170" dur="7s" repeatCount="indefinite"/>
    </circle>
    <!-- floating code chips -->
    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14">
      <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="6s" repeatCount="indefinite"/>
        <rect x="700" y="46" width="168" height="34" rx="9" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="716" y="68" fill="#C084FC">const</text><text x="764" y="68" fill="#e6edf3">ship = () =&gt;</text></g>
      <g><animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="5s" repeatCount="indefinite"/>
        <rect x="760" y="108" width="190" height="34" rx="9" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="776" y="130" fill="#7ee787">git push</text><text x="852" y="130" fill="#8b949e">origin main</text></g>
      <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="6.5s" repeatCount="indefinite"/>
        <rect x="690" y="168" width="150" height="34" rx="9" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="706" y="190" fill="#79c0ff">&lt;Figma /&gt;</text><text x="790" y="190" fill="#8b949e">→ 🚀</text></g>
    </g>
    <text x="60" y="66" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" fill="#8b949e">// hello, world — I'm</text>
    <text x="58" y="126" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="800" fill="#ffffff">Athul S Nair</text>
    <rect x="62" y="140" width="90" height="5" rx="2.5" fill="url(#shine)"/>
    <g clip-path="url(#type)">
      <text x="60" y="178" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#c9d1d9">Software Engineer · Full Stack &amp; CMS · Kerala, India</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="999" height="239" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>