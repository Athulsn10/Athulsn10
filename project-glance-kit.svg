<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#221545"/><stop offset="100%" stop-color="#0d1117"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#C084FC"/><stop offset="100%" stop-color="#7F3ACE"/></linearGradient>
    <radialGradient id="glow"><stop offset="0%" stop-color="#7F3ACE" stop-opacity="0.5"/><stop offset="100%" stop-color="#7F3ACE" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7F3ACE"/><stop offset="100%" stop-color="#C084FC" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="1000" height="240" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1000" height="240" fill="url(#g)"/>
    <rect width="600" height="3" fill="url(#edge)"/>
    <circle cx="840" cy="120" r="150" fill="url(#glow)"><animate attributeName="r" values="135;165;135" dur="6s" repeatCount="indefinite"/></circle>
    <!-- glass widget mock -->
    <rect x="730" y="40" width="220" height="160" rx="26" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.18"/>
    <g transform="translate(810 120) scale(0.72) rotate(-90)">
      <circle r="62" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="12"/>
      <circle r="62" fill="none" stroke="url(#ring)" stroke-width="12" stroke-linecap="round" stroke-dasharray="389.6" stroke-dashoffset="124.7">
        <animate attributeName="stroke-dashoffset" values="389.6;124.7" dur="1.8s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1"/>
      </circle>
    </g>
    <text x="810" y="118" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#fff">68%</text>
    <text x="810" y="136" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#c9d1d9">of today</text>
    <text x="872" y="92" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#8b949e">STEPS</text>
    <text x="872" y="110" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">6,842</text>
    <text x="872" y="138" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#8b949e">BATTERY</text>
    <text x="872" y="156" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#7ee787">82%</text>
    <!-- copy -->
    <rect x="40" y="34" width="118" height="24" rx="12" fill="#7F3ACE"/>
    <circle cx="54" cy="46" r="3.5" fill="#fff"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="107" y="50.5" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="800" fill="#fff" letter-spacing="0.6">LATEST BUILD</text>
    <text x="40" y="100" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="800" fill="#fff">Glance Kit</text>
    <text x="40" y="130" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#c9d1d9">Minimal Android home screen widgets: steps, battery, data,</text>
    <text x="40" y="152" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#c9d1d9">focus timer, barometer and compass, reading straight from the device.</text>
    <rect x="40" y="172" width="67" height="28" rx="14" fill="#7F3ACE" fill-opacity="0.16" stroke="#7F3ACE" stroke-opacity="0.45"/><text x="73" y="190.5" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#C084FC">Kotlin</text><rect x="114.8" y="172" width="106" height="28" rx="14" fill="#7F3ACE" fill-opacity="0.16" stroke="#7F3ACE" stroke-opacity="0.45"/><text x="168" y="190.5" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#C084FC">Android 12+</text><rect x="228.6" y="172" width="82" height="28" rx="14" fill="#7F3ACE" fill-opacity="0.16" stroke="#7F3ACE" stroke-opacity="0.45"/><text x="270" y="190.5" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#C084FC">Firebase</text><rect x="319.0" y="172" width="129" height="28" rx="14" fill="#7F3ACE" fill-opacity="0.16" stroke="#7F3ACE" stroke-opacity="0.45"/><text x="384" y="190.5" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#C084FC">GitHub Actions</text>
    <text x="960" y="220" text-anchor="end" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#C084FC">View repo →</text>
  </g>
  <rect x="0.5" y="0.5" width="999" height="239" rx="16" fill="none" stroke="#30363d"/>
</svg>